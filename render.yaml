# Render Blueprint: one-click deploy of the app + a managed PostgreSQL database.
# Dashboard -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: taskflow
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DIALECT
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
      - key: DB_SSL
        value: 'false'
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CORS_ORIGIN
        value: '*'
      - key: SEED_DEMO
        value: 'true'
      - key: ADMIN_EMAIL
        value: admin@taskflow.com
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: taskflow-db
    plan: free
    databaseName: taskflow
